version: 2

models:
  - name: stg_stock_prices
    description: Clean staging model for historical stock prices.
    columns:
      - name: ticker
        tests:
          - not_null

      - name: price_date
        tests:
          - not_null

      - name: close_price
        tests:
          - not_null

      - name: volume
        tests:
          - not_null