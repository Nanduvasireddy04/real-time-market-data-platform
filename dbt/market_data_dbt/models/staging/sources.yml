version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_stock_prices
        description: Raw OHLCV stock price data loaded from yfinance into PostgreSQL.
        columns:
          - name: ticker
            tests:
              - not_null
          - name: price_date
            tests:
              - not_null
          - name: close_price
            tests:
              - not_null
          - name: volume
            tests:
              - not_null